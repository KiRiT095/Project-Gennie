[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuna-companion"
version = "0.2.0"
description = "Tuna — a local-first desktop AI companion prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["app*"]
